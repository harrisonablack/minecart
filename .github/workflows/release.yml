name: Release

on:
  workflow_dispatch:

# Releases are cut from the latest commit on main; branch protection ensures
# that commit is a squash-merged PR with a conventional title.
permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # CalVer: YYYY.M.n, where n is the nth release of the month. The version
      # is derived from existing tags; the tag itself is created by the
      # release step below.
      - name: Compute next version
        id: version
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: calver

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push before tagging so a failed build never leaves a tag
      # without a matching image.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.v-version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
