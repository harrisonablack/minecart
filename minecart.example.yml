# Minecart configuration template.
# Copy this file to minecart.yml and adjust as needed.

# Where to install and run the server (relative to the current directory).
directory: server

server:
  # Server type: vanilla | paper
  type: vanilla
  # Minecraft version, or "latest" for the newest release.
  version: latest
  # Accept the Minecraft EULA (required).
  eula: true
  # Java heap size (passed as -Xmx).
  memory: "2G"
  # Extra arguments passed to the server.
  args: ["nogui"]

# Merge these values into files before every server launch.
# Paths are relative to directory. Omit config.files to manage no files.
# Undeclared values survive; removing a declaration does not reset its value.
config:
  files:
    server.properties:
      motd: "My server"
      max-players: 20
      # Dots in property keys are literal.
      rcon.port: 25575
      # Properties accept strings, numbers, and booleans, including empty strings.
      resource-pack: ""
